<style id="app-css">:root {
  --shell: #FDF2F7;
  --surface: #FFFFFF;
  --cream: #F7EFE2;
  --hot: #F33781;
  --deep: #A81555;
  --ink: #3A1026;
  --ink-soft: #8A5E73;
  --line: #F6CEE1;
  --focus: #A81555;
  --btn-bg: #F33781;
  --btn-fg: #FFFFFF;
  --err: #C0203C;
  --glow: rgba(243, 55, 129, 0.22);
  --f-head: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell: #1A0812;
    --surface: #2B1020;
    --cream: #3A1729;
    --hot: #FF74AD;
    --deep: #FFA7C9;
    --ink: #FDEAF3;
    --ink-soft: #C79BB2;
    --line: #4B1F36;
    --focus: #FF74AD;
    --btn-bg: #FF74AD;
    --btn-fg: #2B1020;
    --err: #FF9C94;
    --glow: rgba(255, 116, 173, 0.25);
  }
}
:root[data-theme="dark"] {
  --shell: #1A0812;
  --surface: #2B1020;
  --cream: #3A1729;
  --hot: #FF74AD;
  --deep: #FFA7C9;
  --ink: #FDEAF3;
  --ink-soft: #C79BB2;
  --line: #4B1F36;
  --focus: #FF74AD;
  --btn-bg: #FF74AD;
  --btn-fg: #2B1020;
  --err: #FF9C94;
  --glow: rgba(255, 116, 173, 0.25);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--shell); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--shell);
  color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  -webkit-text-size-adjust: 100%;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.edge {
  height: 12px;
  background: repeating-linear-gradient(115deg,
    var(--hot) 0 18px, var(--cream) 18px 30px);
}
.wrap { max-width: 640px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
.top { padding-top: 20px; display: flex; align-items: center; gap: 13px; }

.brand { font: 700 24px/1 var(--f-head); letter-spacing: 0.07em; color: var(--deep); }
.brand-sub { margin-top: 3px; color: var(--ink-soft); font-size: 14px; }
.main { padding-top: 26px; padding-bottom: 36px; min-height: 60vh; }

h1 { margin: 0 0 8px; font: 600 clamp(29px, 7.4vw, 40px)/1.12 var(--f-head); color: var(--deep); }
h3 { margin: 26px 0 10px; font: 600 18px/1.25 var(--f-head); color: var(--deep); }
.lead { margin: 0 0 20px; color: var(--ink-soft); max-width: 46ch; }
.sub { margin: 0; color: var(--ink-soft); font-size: 14px; }

.search { display: grid; gap: 8px; }
.search label { font-weight: 600; font-size: 15px; }
input[type="text"], input[type="password"], input[type="date"], input[type="number"], select, textarea {
  width: 100%;
  padding: 13px 16px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink);
  font: 500 16px/1.3 var(--f-body);
}
input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus { border-color: var(--hot); }
textarea { min-height: 96px; resize: vertical; }
#kode { font: 600 19px/1.2 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; }
#kode::placeholder { font-weight: 400; color: var(--ink-soft); opacity: 0.75; }

.btn {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 13px 24px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  font: 600 15px/1.2 var(--f-head);
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 0 5px 14px var(--glow);
}
.btn:disabled { opacity: 0.55; cursor: default; box-shadow: none; }
.btn.ghost { background: var(--surface); color: var(--deep); border: 2px solid var(--line); box-shadow: none; }
.btn.small { padding: 9px 16px; font-size: 14px; }
.btn.danger { background: var(--surface); color: var(--err); border: 2px solid var(--err); box-shadow: none; }
.search .btn { justify-self: start; margin-top: 4px; }

.msg { min-height: 1.4em; margin: 10px 0 0; font-size: 15px; }
.msg.err { color: var(--err); }
.msg.ok { color: var(--deep); }
.out { margin-top: 14px; }

.card {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 26px;
  padding: 22px 20px 24px;
  box-shadow: 0 14px 34px var(--glow);
}
.card-head { display: grid; gap: 10px; }
.kode { margin: 0; font: 600 clamp(20px, 5.4vw, 26px)/1.15 var(--f-head); letter-spacing: 0.04em; color: var(--deep); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 999px;
  background: var(--cream);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
}
.who { margin: 12px 0 0; color: var(--ink-soft); }
.who strong { color: var(--ink); }

.now {
  margin-top: 18px; padding: 16px 18px;
  background: linear-gradient(135deg, var(--hot), color-mix(in srgb, var(--hot) 68%, var(--deep)));
  border-radius: 20px; color: #FFFFFF;
}
.now p { margin: 0; }
.now-lbl { font-size: 14px; opacity: 0.9; }
.now-val { font: 600 clamp(21px, 5.6vw, 26px)/1.2 var(--f-head); margin-top: 3px !important; }
.now-when { font-size: 14px; opacity: 0.9; margin-top: 3px !important; }

.items { list-style: none; margin: 0; padding: 0; }
.items li { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-top: 2px dotted var(--line); }
.items li:first-child { border-top: 0; }
.items .qty { font-weight: 700; white-space: nowrap; color: var(--deep); }
.items .var { color: var(--ink-soft); font-size: 14px; }

.resi {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; background: var(--cream); border-radius: 18px; margin-top: 22px;
}
.resi p { margin: 0; }
.resi-no { font: 600 19px/1.25 var(--f-head); letter-spacing: 0.04em; color: var(--deep); overflow-wrap: anywhere; }

.route { list-style: none; margin: 4px 0 0; padding: 0 0 0 26px; position: relative; display: grid; gap: 12px; }
.route::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 16px; border-left: 3px dotted var(--line); }
.stamp { position: relative; }
.stamp::before {
  content: ""; position: absolute; left: -26px; top: 15px; width: 13px; height: 13px;
  border-radius: 50%; background: var(--surface); border: 3px solid var(--line);
}
.stamp.done::before { background: var(--hot); border-color: var(--hot); }
.stamp.now::before { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 0 5px var(--glow); }
.mark {
  display: inline-flex; flex-direction: column; gap: 1px;
  padding: 10px 18px;
  border-radius: 18px;
  background: var(--cream);
  color: var(--ink);
}
.stamp.now .mark {
  background: var(--surface);
  border: 2px solid var(--hot);
  color: var(--deep);
  box-shadow: 0 6px 16px var(--glow);
  animation: pop 0.38s ease-out 1 both;
}
.stamp.now .s-status::after { content: " \u2726"; color: var(--hot); }
.stamp.next .mark { background: transparent; border: 2px dashed var(--line); color: var(--ink-soft); }
.s-status { font: 600 16px/1.25 var(--f-head); }
.s-date { font-size: 13px; font-weight: 600; opacity: 0.8; }
.s-note { margin: 6px 0 0 4px; font-size: 14.5px; color: var(--ink-soft); max-width: 46ch; }
@keyframes pop {
  from { opacity: 0; transform: scale(0.94); }
  to { opacity: 1; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .stamp.now .mark { animation: none; } }

      o.negara = f.negara.value;
      o.items = items;
      o.resi = f.no.value.trim() ? { ekspedisi: f.eks.value.trim(), nomor: f.no.value.trim() } : null;
      markDirty(o);
      showAdmin();
    }, 'small')));

    var st = el('input', { type: 'text', list: 'tahap-list', placeholder: 'Pilih atau ketik status' });
    var tg = el('input', { type: 'date', value: today() });
    var ct = el('input', { type: 'text', placeholder: 'Contoh: Barang sudah sampai di gudang' });
    wrap.appendChild(el('h4', null, 'Tambah status baru'));
    wrap.appendChild(tahapList());
    wrap.appendChild(el('div', { class: 'two' }, field('Status', st), field('Tanggal', tg)));
    wrap.appendChild(field('Catatan untuk customer (opsional)', ct));
    wrap.appendChild(el('div', null, button('Tambah status', function () {
      var s = st.value.trim();
      if (!s) { st.focus(); return; }
      o.events.push({ status: s, tgl: tg.value || today(), catatan: ct.value.trim() });
      sortEvents(o);
      markDirty(o);
      showAdmin();
    }, 'small')));

    wrap.appendChild(el('h4', null, 'Riwayat status'));
    var evs = el('ul', { class: 'evs' });
    o.events.forEach(function (e, i) {
      evs.appendChild(el('li', null,
        el('span', null, e.status + ' \u2013 ' + fmtDate(e.tgl)),
        button('Hapus', function () { o.events.splice(i, 1); markDirty(o); showAdmin(); }, 'small ghost')));
    });
    if (!o.events.length) evs.appendChild(el('li', { class: 'sub' }, 'Belum ada status.'));
    wrap.appendChild(evs);

    var del = el('button', { type: 'button', class: 'btn danger small' }, 'Hapus order ini');
    var armed = false;
    del.addEventListener('click', function () {
      if (!armed) {
        armed = true; del.textContent = 'Klik lagi untuk menghapus';
        setTimeout(function () { armed = false; del.textContent = 'Hapus order ini'; }, 3500);
        return;
      }
      state.orders = state.orders.filter(function (x) { return x !== o; });
      ui.open = null;
      markDirty(null);
      showAdmin();
    });
    wrap.appendChild(el('div', null, del));
    return wrap;
  }

  function newOrderPanel() {
    var touched = false;
    var neg = negaraSelect('KR');
    var kode = el('input', { type: 'text', value: genKode('KR'), autocapitalize: 'characters', spellcheck: 'false' });
    kode.addEventListener('input', function () { touched = true; });
    neg.addEventListener('change', function () { if (!touched) kode.value = genKode(neg.value); });
    var user = el('input', { type: 'text', placeholder: '@username' });
    var batch = el('input', { type: 'text', placeholder: 'Contoh: 3' });
    var items = el('textarea', { placeholder: 'Laneige Lip Sleeping Mask | Berry | 2' });
    var st = el('input', { type: 'text', list: 'tahap-list', value: TAHAP[0] });
    var tg = el('input', { type: 'date', value: today() });
    var msg = el('p', { class: 'msg err' });
    var p = el('div', { class: 'panel' },
      el('h3', null, 'Order baru'),
      tahapList(),
      el('div', { class: 'two' }, field('Username customer', user), field('Batch', batch)),
      field('Negara', neg),
      field('Barang (satu baris per barang: nama | varian | jumlah)', items),
      field('Kode order (dibuat acak, boleh diganti)', kode),
      el('p', { class: 'sub' }, 'Kode acak lebih aman daripada urutan seperti HST-KR-0012, karena tidak bisa ditebak customer lain.'),
      el('div', { class: 'two' }, field('Status awal', st), field('Tanggal', tg)),
      msg);
    p.appendChild(el('div', null, button('Tambah order', function () {
      var k = kode.value.trim().toUpperCase();
      var its = parseItems(items.value);
      if (!user.value.trim() || !its.length) { msg.textContent = 'Isi username dan minimal satu barang.'; return; }
      if (norm(k).length < 10) { msg.textContent = 'Kode order terlalu pendek, pakai minimal 10 huruf/angka.'; return; }
      if (state.orders.some(function (x) { return norm(x.kode) === norm(k); })) { msg.textContent = 'Kode order ini sudah dipakai.'; return; }
      if (!st.value.trim()) { msg.textContent = 'Isi status awal.'; return; }
      var o = {
        kode: k, idx: null, username: user.value.trim(), negara: neg.value, batch: batch.value.trim(),
        items: its, events: [{ status: st.value.trim(), tgl: tg.value || today(), catatan: '' }], resi: null
      };
      state.orders.push(o);
      markDirty(o);
      ui.panel = null; ui.open = o.kode;
      showAdmin();
    })));
    return p;
  }

  function settingsPanel() {
    var hint = el('input', { type: 'text', value: state.hint || '', placeholder: 'Teks bantuan di bawah kolom kode order' });
    var p1 = el('input', { type: 'password', autocomplete: 'new-password' });
    var p2 = el('input', { type: 'password', autocomplete: 'new-password' });
    var msg = el('p', { class: 'msg' });
    return el('div', { class: 'panel' },
      el('h3', null, 'Pengaturan'),
      field('Teks bantuan untuk customer (kosongkan untuk teks standar)', hint),
      field('Password admin baru (kosongkan jika tidak diganti)', p1),
      field('Ulangi password admin baru', p2),
      msg,
      el('div', null, button('Simpan pengaturan', function () {
        if (p1.value || p2.value) {
          if (p1.value.length < 8) { msg.className = 'msg err'; msg.textContent = 'Password minimal 8 karakter.'; return; }
          if (p1.value !== p2.value) { msg.className = 'msg err'; msg.textContent = 'Kedua password harus sama.'; return; }
          state.pass = p1.value;
        }
        state.hint = hint.value.trim();
        state.dirty = true;
        ui.panel = null;
        showAdmin();
      })));
  }

  async function discard() {
    try { state = await openState(state.origPass); } catch (e) { state = null; }
    ui.panel = null; ui.open = null;
    showAdmin();
  }

  async function publish(pubBtn, cancelBtn, note) {
    if (!art) return;
    pubBtn.disabled = true; cancelBtn.disabled = true; pubBtn.textContent = STANDALONE ? 'Menyiapkan\u2026' : 'Menerbitkan\u2026';
    try {
      var c = {};
      for (var i = 0; i < state.orders.length; i++) {
        var o = state.orders[i];
        if (o.idx && !state.dirtySet.has(o.kode) && vault.c[o.idx]) { c[o.idx] = vault.c[o.idx]; continue; }
        var r = await sealFor('K|' + norm(o.kode), customerView(o), vault.salt);
        o.idx = r.idx; c[r.idx] = r.blob;
      }
      var a = await sealFor('A|' + state.pass, { orders: state.orders.map(adminView) }, vault.salt);
      var nv = { v: 1, salt: vault.salt, updated: new Date().toISOString(), hint: state.hint || '', c: c, a: a.blob };
      var html = assembleDoc(css, src, nv);
      if (src.length < 2000 || !css) throw { code: 'invalid_content' };
      store('hs_pass', state.pass); store('hs_admin', '1');
      await art.publish(html);
      if (STANDALONE) {
        note.textContent = 'File index.html sudah diunduh. Unggah untuk mengganti file lama di hosting.';
        pubBtn.disabled = false; cancelBtn.disabled = false; pubBtn.textContent = 'Unduh lagi';
      } else {
        note.textContent = 'Sudah diterbitkan.';
      }
    } catch (e) {
      note.textContent = errText(e);
      pubBtn.disabled = false; cancelBtn.disabled = false; pubBtn.textContent = STANDALONE ? 'Unduh halaman baru' : 'Terbitkan';
    }
  }

  function updateBar() {
    if (!barEl) return;
    barEl.textContent = '';
    if (!state || !state.dirty || view !== 'admin') { barEl.hidden = true; return; }
    barEl.hidden = false;
    var note = el('p', null, art ? (STANDALONE ? 'Ada perubahan yang belum masuk ke file halaman.' : 'Ada perubahan yang belum diterbitkan.') : 'Penerbitan tidak tersedia di tampilan ini.');
    var pub = el('button', { type: 'button', class: 'btn small', disabled: art ? null : true }, STANDALONE ? 'Unduh halaman baru' : 'Terbitkan');
    var can = el('button', { type: 'button', class: 'btn small ghost' }, 'Batalkan');
    pub.addEventListener('click', function () { publish(pub, can, note); });
    can.addEventListener('click', discard);
    barEl.appendChild(note); barEl.appendChild(pub); barEl.appendChild(can);
  }

  async function downloadDoc(html) {
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ } }, 4000);
    return { version: 'download' };
  }

  /* ---------- shell ---------- */
  function renderFoot() {
    foot.textContent = '';
    foot.appendChild(el('p', null, 'Status diperbarui manual oleh admin, jadi bisa ada jeda dari kondisi barang sebenarnya.'));
    if (vault.updated) foot.appendChild(el('p', null, 'Data diperbarui ' + fmtDate(vault.updated.slice(0, 10)) + '.'));
    if (canEdit) {
      foot.appendChild(el('button', {
        type: 'button', class: 'linkbtn',
        onclick: function () { if (view === 'admin') { showCustomer(); } else { showAdmin(); } }
      }, view === 'admin' ? 'Kembali ke halaman customer' : 'Mode admin'));
    }
  }

  async function boot() {
    vault = JSON.parse(document.getElementById('vault').textContent);
    css = document.getElementById('app-css').textContent;
    src = document.getElementById('app-src').textContent;
    var root = document.getElementById('root');
    main = el('main', { class: 'wrap main' });
    foot = el('footer', { class: 'wrap foot' });
    barEl = el('div', { class: 'bar', hidden: true });
    root.appendChild(el('div', { class: 'edge', 'aria-hidden': 'true' }));
    root.appendChild(el('header', { class: 'wrap top' },
      el('div', { class: 'logo', role: 'img', 'aria-label': 'Logo HERSTOOD' }),
      el('div', null, el('div', { class: 'brand' }, 'HERSTOOD'), el('div', { class: 'brand-sub' }, 'Lacak pesanan jastip'))));
    root.appendChild(main); root.appendChild(foot); root.appendChild(barEl);
    showCustomer();

    if (STANDALONE) {
      if (location.hash !== '#admin') return;
      canEdit = true; art = { publish: downloadDoc };
    } else {
      try {
        if (window.claude && window.claude.use) {
          var u = await window.claude.use('user');
          canEdit = u ? !!(await u.canEdit()) : false;
          art = await window.claude.use('artifact');
        }
      } catch (e) { canEdit = false; }
      if (!canEdit) return;
    }
    renderFoot();
    var p = fetchStore('hs_pass');
    if (p && fetchStore('hs_admin') === '1') {
      try { state = await openState(p); showAdmin(); return; } catch (e) { unstore('hs_pass'); unstore('hs_admin'); }
    }
    if (STANDALONE) showAdmin();
  }

  if (typeof document === 'undefined') {
    globalThis.HS = {
      derive: derive, encryptWith: encryptWith, decryptWith: decryptWith, sealFor: sealFor,
      customerView: customerView, adminView: adminView, assembleDoc: assembleDoc, newSalt: newSalt, norm: norm
    };
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
